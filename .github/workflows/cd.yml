name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: silo-backend:scan
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: silo-backend:scan
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      - name: Push backend image
        run: |
          docker tag silo-backend:scan ${{ secrets.DOCKERHUB_USERNAME }}/silo-backend:latest
          docker tag silo-backend:scan ${{ secrets.DOCKERHUB_USERNAME }}/silo-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/silo-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/silo-backend:${{ github.sha }}

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: silo-frontend:scan
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            VITE_SENTRY_ENVIRONMENT=production
            VITE_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: silo-frontend:scan
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      - name: Push frontend image
        run: |
          docker tag silo-frontend:scan ${{ secrets.DOCKERHUB_USERNAME }}/silo-frontend:latest
          docker tag silo-frontend:scan ${{ secrets.DOCKERHUB_USERNAME }}/silo-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/silo-frontend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/silo-frontend:${{ github.sha }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/silo
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose exec -T backend npx prisma migrate deploy
            docker image prune -f
