# Local development compose — no TLS, ports exposed directly, hot-reload friendly.
# Usage: docker compose -f docker-compose.dev.yml up
# Backend and frontend are run locally (npm run dev), this just spins up dependencies.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: silo
      POSTGRES_PASSWORD: silo
      POSTGRES_DB: silo
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
